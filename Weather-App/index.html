<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <script
      src="https://kit.fontawesome.com/68ef19b542.js"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <div class="main-box">
      <div class="input">
        <input type="text" id="text" placeholder="Search Location" />
        <i class="fa-solid fa-magnifying-glass" id="search_btn"></i>
      </div>

      <div class="image-box">
        <div class="img">
          <img src="/images/clear-sky.png" id="img" width="150px" />
        </div>
        <div class="degree">
          <h1 id="degree">29°c</h1>
          <h1 id="city">ROORKEE</h1>
        </div>
      </div>

      <div class="wind-section">
        <span class="humidity"><i class="bi bi-moisture"></i></span>

        <div class="h1">
          <h1 id="humidity">61%</h1>
          <span>Humidity</span>
        </div>
        <span class="humidity"><i class="bi bi-wind"></i></span>

        <div class="h1">
          <h1 id="wind">12km/h</h1>
          <span>Wind Speed</span>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
